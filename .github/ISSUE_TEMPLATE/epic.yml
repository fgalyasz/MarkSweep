name: Epic
description: Product increment with a PRD (PDLC step 4)
title: "[EPIC] "
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One user-visible goal. Hungarian talk stays in chat; this issue is English.
    validations:
      required: true
  - type: input
    id: prd
    attributes:
      label: PRD path
      placeholder: _bmad-output/planning-artifacts/prds/prd-MarkSweep-slug/prd.md
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
      value: |
        - FR-1
    validations:
      required: true
  - type: textarea
    id: stories
    attributes:
      label: Stories
      value: |
        - [ ] [STORY] #N.1
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Add this epic and every sub-issue to [MarkSweep project #9](https://github.com/users/fgalyasz/projects/9) with `./scripts/pdlc-project-item.sh <n> "Todo"`.
